name: Fork release

on:
  push:
    tags:
      - "v*-gost.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version written into binaries
        required: true
        default: 0.28.0-gost-auto

permissions:
  contents: write

jobs:
  gost:
    name: GOST ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake perl pkg-config curl git python3 file
      - name: Select version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"
          else
            echo "value=${{ inputs.version }}" >> "${GITHUB_OUTPUT}"
          fi
      - name: Build archive
        env:
          VERSION: ${{ steps.version.outputs.value }}
          JOBS: "4"
        run: |
          ./scripts/build-gost-linux.sh
          name="blackbox_exporter-${VERSION}.linux-${{ matrix.arch }}"
          mkdir -p "release/${name}"
          cp dist/blackbox_exporter-gost "release/${name}/blackbox_exporter"
          cp blackbox.yml LICENSE NOTICE "release/${name}/"
          tar -C release -czf "release/${name}.tar.gz" "${name}"
          (cd release && sha256sum "${name}.tar.gz") > "release/${name}.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gost-linux-${{ matrix.arch }}
          path: |
            release/*.tar.gz
            release/*.sha256
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [gost]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release
          merge-multiple: true
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            release/*
